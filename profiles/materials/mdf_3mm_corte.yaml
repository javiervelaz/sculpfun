# VERIFICADO el 2026-09-01. Material del primer producto (soporte para
# notebook de dos piezas encastradas).
#
# Los cuatro valores salieron de medir, no de un foro:
#   speed / passes  -> laserq cut-test, celda más rápida que atravesó limpio
#   thickness_mm    -> calibre sobre la plancha
#   kerf_mm         -> laserq kerf-comb, ranura donde la galga entró justa
#
# De acá sale la medida que importa: una ranura que tiene que aceptar una
# lengüeta de esta misma plancha se dibuja de
#   2.90 - 0.25 = 2.65 mm
# Si comprás una plancha de otro lote, remedí el espesor antes de producir:
# el MDF varía y 0.2 mm de más es un encastre que baila.
material: MDF crudo
thickness_mm: 2.90       # medido con calibre
operation: cut
speed: 300
power: 1000
passes: 3
kerf_mm: 0.25            # medido con el peine
air_assist: true
z_offset_mm: 0.0
notes: >
  Tres pasadas a 300 mm/min atraviesan limpio. Varias pasadas rápidas dan
  mejor canto que una sola lenta: el aire alcanza a limpiar entre pasadas y
  carboniza menos. Enfocar sobre la superficie, no en el medio del espesor.
  SIEMPRE con panal debajo y extracción encendida: el humo del MDF lleva
  resinas de urea-formaldehído.
  Para producto: el canto queda negro y mancha las manos. Cinta de papel
  sobre la cara visible antes de cortar, y sellador o lija fina en el canto
  después. Es parte del costo de la pieza, no un detalle.
verified_on: "2026-09-01"
