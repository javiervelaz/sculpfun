[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laserq"
version = "0.1.0"
description = "Control y automatización de grabado láser para SculpFun S30 Pro Max (GRBL 1.1)"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
preview = ["matplotlib>=3.7"]   # solo para `laserq preview`

[project.scripts]
laserq = "laserq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
